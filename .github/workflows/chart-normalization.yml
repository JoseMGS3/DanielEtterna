name: Chart normalization tests (2.0-dev)

on:
  push:
    branches: [2.0-dev]
  workflow_dispatch:

jobs:
  normalize-4k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check chart normalization
        run: python -m unittest discover -s tests -p "test_chart_normalization.py" -v
